version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: quant-trading-postgres
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant_dev_password
      POSTGRES_DB: quant_trading
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quant_trading"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: