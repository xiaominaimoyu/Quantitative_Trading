# Alembic Configuration

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file
template = generic

# sys.path path
prepend_sys_path = .

# timezone
timezone = UTC

# max length of characters in the SQL output
truncate_length = 80

# output encoding
output_encoding = utf-8

# version path separator
version_path_separator = os

[postgresql]
# database URL
sqlalchemy.url = postgresql+psycopg://quant:quant_dev_password@127.0.0.1:5432/quant_trading

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s